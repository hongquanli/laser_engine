name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -v

  compile-firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install arduino-cli
        env:
          ARDUINO_CLI_VERSION: "1.2.2"
        run: |
          mkdir -p $PWD/bin
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/v${ARDUINO_CLI_VERSION}/install.sh | BINDIR=$PWD/bin sh -s $ARDUINO_CLI_VERSION
          echo "$PWD/bin" >> $GITHUB_PATH

      - name: Cache Arduino core and libraries
        uses: actions/cache@v4
        with:
          path: |
            ~/.arduino15
            ~/Arduino/libraries
          key: arduino-${{ runner.os }}-teensy-1.60.0-crc32-2.0.1-elapsedmillis-1.0.6

      - name: Install Teensy board package and libraries
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls https://www.pjrc.com/teensy/package_teensy_index.json
          arduino-cli core update-index
          arduino-cli core install teensy:avr@1.60.0
          arduino-cli lib install "CRC32"@2.0.1 "elapsedMillis"@1.0.6

      - name: Compile laser_engine firmware
        run: arduino-cli compile -b teensy:avr:teensy41 ./laser_engine

      - name: Compile tcm_args_download firmware
        run: arduino-cli compile -b teensy:avr:teensy41 ./tcm_args_download
